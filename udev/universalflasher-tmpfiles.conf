# Keeps /dev/probe when the last probe is unplugged, so a container bind of the directory stays valid: udev removes
# only empty directories, and the .keep file stops it.
#
# Install:
#   sudo cp universalflasher-tmpfiles.conf /etc/tmpfiles.d/universalflasher.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/universalflasher.conf

d /dev/probe 0755 root root -
f /dev/probe/.keep 0644 root root -
